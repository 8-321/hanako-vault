<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>含 · 互动动画 Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" id="stage">
    <div class="grain"></div>
    <div class="ink-cloud cloud-a"></div>
    <div class="ink-cloud cloud-b"></div>

    <section class="demo-card" id="demoCard" aria-label="含的互动动画演示">
      <div class="card-topline">
        <span class="tiny-dot"></span>
        <span>HAN · INTERACTIVE MOTION</span>
      </div>

      <div class="motion-area" id="motionArea">
        <div class="orbit-ring ring-one"></div>
        <div class="orbit-ring ring-two"></div>
        <div class="halo" id="halo"></div>
        <button class="han-core" id="hanCore" aria-label="点击唤醒含">
          <span class="core-glass"></span>
          <span class="core-mark">含</span>
          <span class="core-breath"></span>
        </button>
        <div class="particle-field" id="particleField"></div>
      </div>

      <div class="copy-block">
        <p class="eyebrow">A quiet living interface</p>
        <h1 id="titleText">她在低频呼吸，等你靠近。</h1>
        <p id="bodyText">移动鼠标，她会转向你；点击中央，她会醒来；拖动下方的情绪刻度，气质会从沉静过渡到发光。</p>
      </div>

      <div class="control-panel">
        <label class="mood-label" for="moodRange">
          <span>情绪光谱</span>
          <strong id="moodName">沉静</strong>
        </label>
        <input id="moodRange" class="mood-range" type="range" min="0" max="100" value="28" />
        <div class="hint-row">
          <span>靠近</span>
          <span>点击</span>
          <span>拖动</span>
        </div>
      </div>
    </section>

    <footer class="footnote">独立零依赖 demo · HTML / CSS / JavaScript</footer>
  </main>

  <script src="script.js"></script>
<script src="../relay-frame.js"></script>
</body>
</html>

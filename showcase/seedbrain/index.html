<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SeedBrain｜AI 记录与创作复刻原型</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <div class="brand-name">SeedBrain</div>
          <div class="brand-subtitle">记录自己，长成作品</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-card">
        <div class="muted">主动智能体</div>
        <strong id="agentPulse">正在观察你的知识森林</strong>
        <p>它会从历史记录里找重复困惑、闪光点和可成文的种子。</p>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">首页</h1>
          <p id="pageSubtitle">把碎片记录变成可调用的大脑。</p>
        </div>
        <div class="top-actions">
          <button class="ghost" id="exportBtn">导出 JSON</button>
          <label class="ghost file-label">导入 JSON<input id="importFile" type="file" accept="application/json" /></label>
          <button class="primary" data-open-capture>新建记录</button>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <div class="modal hidden" id="captureModal">
    <div class="modal-panel wide">
      <div class="modal-head">
        <div>
          <h2>新建记录</h2>
          <p>文字、语音、图片、链接、文档、会议，都先收进来。</p>
        </div>
        <button class="icon" data-close>×</button>
      </div>
      <div class="capture-grid" id="captureTabs"></div>
      <form id="captureForm" class="capture-form"></form>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>

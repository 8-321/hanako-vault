<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>造字司 · 一笔生万象</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" id="app">
    <div class="paper-grain"></div>
    <div class="mist mist-a"></div>
    <div class="mist mist-b"></div>

    <header class="topbar">
      <div>
        <p class="seal-line">HANAKO INTERACTIVE CULTURE LAB</p>
        <h1>造字司</h1>
      </div>
      <div class="chapter-mark">
        <span>一笔</span>
        <strong>生万象</strong>
      </div>
    </header>

    <section class="layout">
      <aside class="root-panel panel-shell">
        <div class="panel-title">
          <span class="tiny-seal">根</span>
          <div>
            <strong>字根匣</strong>
            <small>拖入墨池，试探会意</small>
          </div>
        </div>
        <div class="root-list" id="rootList"></div>
      </aside>

      <section class="world panel-shell">
        <div class="world-bg" id="worldBg"></div>
        <div class="landscape" id="landscape"></div>

        <div class="ink-pool" id="inkPool" aria-label="造字墨池">
          <div class="pool-orbit orbit-one"></div>
          <div class="pool-orbit orbit-two"></div>
          <div class="pool-light"></div>
          <div class="pool-core">
            <span class="pool-label">造字池</span>
            <div class="ingredient-row" id="ingredientRow"></div>
          </div>
          <div class="ripple-layer" id="rippleLayer"></div>
        </div>

        <div class="result-stage" id="resultStage">
          <div class="result-char" id="resultChar">字</div>
          <div class="result-caption" id="resultCaption">拖两个字根入池</div>
        </div>

        <div class="hint-card" id="hintCard">
          <span>提示</span>
          <p id="hintText">把「日」与「月」拖进墨池，看看会发生什么。</p>
        </div>
      </section>

      <aside class="scroll-panel panel-shell">
        <div class="panel-title">
          <span class="tiny-seal">卷</span>
          <div>
            <strong>山海字卷</strong>
            <small>你唤醒过的字，会留在这里</small>
          </div>
        </div>
        <div class="discovery-list" id="discoveryList"></div>
        <button class="reset-btn" id="resetBtn">清空墨池</button>
      </aside>
    </section>

    <footer class="footer-note">拖拽字根 · 造字会意 · 字成万象</footer>
  </main>

  <script src="vendor/gsap.min.js"></script>
  <script src="script.js"></script>
<script src="../relay-frame.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运行中系统 — RELAY · 接力</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<section class="hero" style="padding-bottom:var(--s-8);">
  <div class="wrap">
    <h1 class="h-display">
      <span class="line"><span>运行中<em>系统</em></span></span>
    </h1>
    <div class="hero__sub">
      <span style="color:var(--ink-dim);">LIVE SYSTEMS // 已跑通管线 + 可用接口 + 本地项目</span>
    </div>
  </div>
</section>

<section class="wrap">
  <div class="gallery-grid" id="sysGrid"></div>
</section>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
var SYSTEMS = [
  {id:'s01', icon:'◇', title:'飞书CLI + Agent', desc:'AppID/Secret已配，tenant_access_token可用。可读写Bitable/Docx。飞书→公众号发布脚本就绪。', tags:['Feishu','API','运行中'], type:'API连接'},
  {id:'s02', icon:'☰', title:'公众号发布管线', desc:'kel-publication-workflow技能。观点→稿→封面→上传草稿箱→核验。关联kel-ai-lab-writer。', tags:['公众号','发布','SKILL'], type:'自动管线'},
  {id:'s03', icon:'◲', title:'微信小程序(4个)', desc:'3D小程序 / TeamRadarLab / 微信一键登入 / 最小Mvp(LifeInbox)。源码在D:/BELLA KE/。', tags:['小程序','微信','前端'], type:'源码就绪'},
  {id:'s04', icon:'○', title:'个人智能体·Hanako', desc:'含系多Agent体系：含/含舟/含章/含枢/含野。心跳巡检+日记+备份+记忆系统。', tags:['Agent','多角色','运行中'], type:'核心系统'},
  {id:'s05', icon:'▧', title:'UI设计 + 动效', desc:'OBSERVER-07档案风格体系(深空黑+古铜金)。含互动动画/造字司/傩火等设计沉淀。', tags:['UI','动效','档案风'], type:'设计系统'},
  {id:'s06', icon:'⬡', title:'AI电商·换装', desc:'未找到本地项目目录。需要你提供位置或信息。', tags:['AI','电商','未找到'], type:'待确认'},
  {id:'s07', icon:'⊟', title:'个人系统中枢·含渡', desc:'15+子Skill。留停删转试五步法+诊断/裁决/陪跑/复盘/产品化/自我定义。', tags:['系统','方法论','就绪'], type:'方法体系'},
  {id:'s08', icon:'◈', title:'自媒体管线', desc:'kel-ai-lab-writer写作技能。选题→大纲→初稿→发布→复盘。真实实验口吻。', tags:['内容','写作','SKILL'], type:'内容管线'},
  {id:'s09', icon:'✦', title:'引星·手势粒子场', desc:'Three.js + MediaPipe。唯一保留的互动Demo。可打开可玩。', tags:['3D','手势','Demo'], type:'互动作品'}
];

(function(){
  var grid = document.getElementById('sysGrid');
  grid.innerHTML = SYSTEMS.map(function(s){
    var isLink = (s.id==='s09');
    return '<div class="card" tabindex="0" role="button" onclick="'+(isLink?'window.open(\'showcase/yinxing/\',\'_blank\')':'alert(\''+s.desc+'\')')+'" onkeydown="if(event.key===\'Enter\')'+(isLink?'window.open(\'showcase/yinxing/\',\'_blank\')':'alert(\''+s.desc+'\')')+'">'+
      '<div class="card__media" style="background:var(--bg-elev)">'+
        '<span class="card__tag">'+s.type+'</span>'+
        '<span class="media-label">SYSTEM // '+s.id+'</span>'+
        '<div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:36px;color:rgba(201,169,110,0.12);">'+s.icon+'</div>'+
      '</div>'+
      '<div class="card__body">'+
        '<div class="card__title">'+s.title+'</div>'+
        '<p class="card__desc">'+s.desc+'</p>'+
        '<div class="card__meta">'+s.tags.map(function(t){return '<span class="card__chip">#'+t+'</span>';}).join('')+'</div>'+
      '</div>'+
    '</div>';
  }).join('');
})();
</script>

</body>
</html>
